<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Friendslop — hi-fi v1</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="friendslop-tokens.css">
<style>
  body {
    margin: 0;
    background: #0a0815;
    color: #f6f3ff;
    font-family: 'Space Grotesk', system-ui, sans-serif;
  }
  /* design canvas frame */
  .dc-artboard__inner { background: transparent !important; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="friendslop-screens.jsx"></script>
<script type="text/babel" src="friendslop-host-screens.jsx"></script>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

function App() {
  return (
    <DesignCanvas>
      <DCSection id="game-flow" title="The locked flow — Friendslop hi-fi v1">
        <DCArtboard id="lobby"      label="01 · Lobby"       width={390} height={844}><LobbyScreen/></DCArtboard>
        <DCArtboard id="charcreate" label="02 · Charcreate"  width={390} height={844}><CharcreateScreen/></DCArtboard>
        <DCArtboard id="answering"  label="03 · Answering"   width={390} height={844}><AnsweringScreen/></DCArtboard>
        <DCArtboard id="reveal"     label="04 · Reveal"      width={390} height={844}><RevealScreen/></DCArtboard>
        <DCArtboard id="grid"       label="05 · Guess grid"  width={390} height={844}><GridScreen/></DCArtboard>
      </DCSection>

      <DCSection id="host-flow" title="The host / TV view — desktop 1280×720">
        <DCArtboard id="host-lobby"      label="01 · Lobby (host)"       width={1280} height={720}><LobbyHostScreen/></DCArtboard>
        <DCArtboard id="host-charcreate" label="02 · Charcreate (host)"  width={1280} height={720}><CharcreateHostScreen/></DCArtboard>
        <DCArtboard id="host-answering"  label="03 · Answering (host)"   width={1280} height={720}><AnsweringHostScreen/></DCArtboard>
        <DCArtboard id="host-reveal"     label="04 · Reveal (host)"      width={1280} height={720}><RevealHostScreen/></DCArtboard>
        <DCArtboard id="host-grid"       label="05 · Guess grid (host)"  width={1280} height={720}><GridHostScreen/></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
